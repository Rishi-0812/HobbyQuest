spring.application.name=HobbyQuest_Backend

# Server
server.port=8080

## Database ? replace with your Neon connection string
#spring.datasource.url=jdbc:postgresql://your-neon-host/hobbyquest?sslmode=require
#spring.datasource.username=your_neon_username
#spring.datasource.password=your_neon_password
#spring.datasource.driver-class-name=org.postgresql.Driver
#
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT ? use a long random string, minimum 256 bits
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

## App name
#spring.application.name=hobbyquest-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/hobbyquest_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash}

spring.profiles.include=local
#Mail section
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
#ekomaharishian@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
#rquy lezp qvhc lpgp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG

